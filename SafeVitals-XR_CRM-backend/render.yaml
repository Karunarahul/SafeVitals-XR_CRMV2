services:
  - type: web
    name: safevitals-xr-crm-backend
    env: node
    plan: standard
    buildCommand: npm install && npm run build
    startCommand: npm run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: HOST
        value: 0.0.0.0
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1d
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGINS
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        value: "SafeVitals XR CRM" <noreply@safevitals.com>
      - key: UPLOAD_DEST
        value: /var/data/uploads
    disk:
      name: uploads-data
      mountPath: /var/data/uploads
      sizeGB: 10
    healthCheckPath: /api/health/ready
